[project]
name = "appsec-threat-hunting-lab"
version = "0.1.0"
description = "Application-Layer Threat Hunting & Telemetry Framework (Purple Team lab)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.2",
    "httpx==0.27.2",
]

[tool.setuptools]
packages = ["labcommon", "simulators", "tools", "tools.labctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--hypothesis-show-statistics -ra"
markers = [
    "integration: requires the running Docker Compose lab",
]
